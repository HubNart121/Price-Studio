runConfig:
  minInstances: 0
  maxInstances: 5
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  - variable: DATA_BACKEND
    value: firestore
    availability:
      - BUILD
      - RUNTIME

  - variable: AUTH_MODE
    value: firebase
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyD2chfMh0_R1X2ANu2RHQz0L3ZZ5ynuaEc
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: import-price-studio-nart.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: import-price-studio-nart
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:154471825748:web:a34637101e8cfe4e2048c1
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "154471825748"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: import-price-studio-nart.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME

  - variable: LOCAL_AUTH_BYPASS
    value: "false"
    availability:
      - RUNTIME
  - variable: ALLOWED_EMAILS
    secret: allowedEmails
